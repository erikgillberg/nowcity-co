<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Inter, Arial, sans-serif" role="img" aria-label="Map of the Willamette Valley innovation corridor from Corvallis through Salem to Portland">
  <defs>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0e6"/>
      <stop offset="100%" stop-color="#e3e6d6"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#211f1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="980" height="520" fill="url(#valley)"/>

  <!-- soft contour hills -->
  <g fill="none" stroke="#d4d8c4" stroke-width="2" opacity="0.8">
    <path d="M0,150 C160,110 300,170 430,140 C600,100 760,160 980,120"/>
    <path d="M0,95 C180,60 320,120 470,92 C640,60 800,110 980,72"/>
    <path d="M0,415 C180,455 330,400 480,432 C650,468 800,420 980,455"/>
  </g>

  <!-- I-5 corridor (straight) -->
  <line x1="120" y1="360" x2="860" y2="200" stroke="#b9a07e" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <text x="300" y="318" fill="#9a8a6c" font-size="11" font-weight="600" letter-spacing="1.5" transform="rotate(-12 300 318)">INTERSTATE 5</text>

  <!-- Willamette River (wavy) -->
  <path d="M120,300 C260,250 300,320 430,278 C560,236 600,300 740,252 C800,232 840,236 880,224"
        fill="none" stroke="#6c8f93" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <text x="556" y="250" fill="#557079" font-size="11" font-weight="600" letter-spacing="1" transform="rotate(-10 556 250)">Willamette River</text>

  <!-- distance labels -->
  <text x="300" y="392" text-anchor="middle" fill="#8c8470" font-size="11.5">about 35 miles</text>
  <text x="660" y="300" text-anchor="middle" fill="#8c8470" font-size="11.5">about 45 miles</text>

  <!-- CORVALLIS (south / left) -->
  <circle cx="150" cy="345" r="13" fill="#48593f" filter="url(#ds)"/>
  <circle cx="150" cy="345" r="5" fill="#f4f1e9"/>
  <text x="150" y="408" text-anchor="middle" fill="#211f1c" font-size="16" font-weight="700">Corvallis</text>
  <g font-size="11.5" fill="#4a4a42">
    <text x="150" y="430" text-anchor="middle">Oregon State University</text>
    <text x="150" y="447" text-anchor="middle">Two federal Tech Hubs</text>
    <text x="150" y="464" text-anchor="middle">Agility Robotics lineage</text>
  </g>

  <!-- SALEM / EDGEWATER (center, emphasized) -->
  <circle cx="470" cy="262" r="26" fill="none" stroke="#a8703f" stroke-width="2.5" opacity="0.7"/>
  <circle cx="470" cy="262" r="17" fill="#a8703f" filter="url(#ds)"/>
  <circle cx="470" cy="262" r="6.5" fill="#fff7ec"/>
  <rect x="362" y="92" width="216" height="86" rx="10" fill="#3c4a34" filter="url(#ds)"/>
  <text x="470" y="120" text-anchor="middle" fill="#f4f1e9" font-size="15.5" font-weight="700">West Salem</text>
  <text x="470" y="140" text-anchor="middle" fill="#d9cdb6" font-size="12">The Edgewater District</text>
  <text x="470" y="160" text-anchor="middle" fill="#d9cdb6" font-size="11">a front door on the river</text>
  <line x1="470" y1="178" x2="470" y2="240" stroke="#a8703f" stroke-width="2" stroke-dasharray="2 5"/>
  <g font-size="11.5" fill="#4a4a42">
    <text x="470" y="316" text-anchor="middle" font-weight="600" fill="#211f1c">Salem</text>
    <text x="470" y="334" text-anchor="middle">Willamette University</text>
    <text x="470" y="351" text-anchor="middle">Agility RoboFab, Chemeketa</text>
    <text x="470" y="368" text-anchor="middle">State capital, Salem Health</text>
  </g>

  <!-- PORTLAND (north / right) -->
  <circle cx="858" cy="205" r="13" fill="#48593f" filter="url(#ds)"/>
  <circle cx="858" cy="205" r="5" fill="#f4f1e9"/>
  <text x="858" y="150" text-anchor="middle" fill="#211f1c" font-size="16" font-weight="700">Portland metro</text>
  <g font-size="11.5" fill="#4a4a42">
    <text x="858" y="172" text-anchor="middle">Silicon Forest</text>
    <text x="858" y="189" text-anchor="middle">Mass-timber economy</text>
  </g>
</svg>
